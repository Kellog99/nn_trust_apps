evaluation:
  statistics: [ "local_accuracy", "local_precision", "local_f1score" ]
  statistic_average_method: "macro"

options:
  load_results: false                 # loading any existing results.
  overwrite: true                     # overwriting the results if a benchmarking is performed
  num_images_to_save: -1
  save_perturbation: false
  gpu: true
  output_path: "./benchmark_out" # Path to the output folder
  output_format: "test" # report or test

datasets:
  - name: "imagenet" # Name of the dataset
    num_classes: 1000
    subset: 10
    batch: 2
    type_dataset: 1
    num_workers: 2
    source_path: "../../../data/imagenet-1k/val_images/" # "../data/military/dataset/test/" # Path to the dataset
    transform_config:
      size: 256
      crop: 224
      transform_id: "imagenet_like_crop"
      mean: [0.5074, 0.5308, 0.5306]
      std: [0.2639, 0.2518, 0.2521]

models:
  - name: 'resnetv2_50d_evos.ah_in1k'
    type: 'timm'
    pretrained: True
    num_classes: 1000
    task: "classification"

attacks:
  - name: 'fgsm'
  - name: 'priorgd'
  - name: 'dag'
  - name: 'du'
  - name: 'fgsm'
    max_iters: 100
    losses: [ "misclassification",
          "totalvariation",
          "similarity",
          "bound" ]

