evaluation:
  statistics:
    - name: 'countsamples'
    - name: 'accuracy'
      average: 'macro'
    - name: 'precision'
      average: 'macro'
    - name: 'robustness'
    - name: 'misclassification'

options:
  load_results: false            # Load any existing results
  overwrite: true                # Overwrite results if benchmarking is performed
  num_images_to_save: -1
  save_perturbation: false
  gpu: true
  output_path: "/home/cristiano-carta/Desktop/output" # Path to the output folder
  output_format: "report"                             # "report" or "test"
  mode : "multi_node_parallel"
  num_workers : 1
  num_gpus_per_worker : 1
  executor_type : "ray"

datasets:
  - name: "animals"             # Dataset name
    num_classes: 90
    subset: 100
    batch: 20
    type_dataset: 2
    num_workers: 2
    source_path: "animals/data"
    transform_config:
      size: 256
      crop: 224
      transform_id: "imagenet_like_crop"
      mean: [0.5074, 0.5308, 0.5306]
      std: [0.2639, 0.2518, 0.2521]
