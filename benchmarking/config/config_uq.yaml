evaluation:
  statistics: [ "local_accuracy", "local_precision", "local_f1score" ]
  statistic_average_method: "macro"

options:
  load_results: false                 # loading any existing results.
  overwrite: true                     # overwriting the results if a benchmarking is performed
  num_images_to_save: -1
  save_perturbation: false
  gpu: true
  output_path: "./benchmark_out" # Path to the output folder
  output_format: "test" # report or test


datasets:
  - name: "military" # Name of the dataset
    num_classes: -1
    subset: -1
    batch: 32
    type_dataset: 2
    num_workers: 2
    source_path: "../data/ADVERSIAL_MILITARY/test_military" # "../data/military/dataset/test/" # Path to the dataset
    transform_config:
      size: 256
      crop: 224
      transform_id: "imagenet_like_crop"
      mean: [0.5074, 0.5308, 0.5306]
      std: [0.2639, 0.2518, 0.2521]

  # - name: "small-sample-imagenet"
  #   num_classes: 1000
  #   subset: -1
  #   batch: 2
  #   type_dataset: 1
  #   num_workers: 2
  #   source_path: "../data/sample_input/"
  #   transform_config:
  #     size: 224
  #     transform_id: "imagenet"
  #     # mean: [0.485, 0.456, 0.406]       # Mean for the Imagenet dataloader
  #     # std: [0.229, 0.224, 0.225]        # Standard deviation for the Imagenet dataloader

# TODO create list of models and their configurations, like for datasets
models:
  # list_models: [ 'resnet101.a1_in1k' ]
  # num_classes: [1000]

  # - name: "resnet101.a1_in1k"
  #   type: "timm"
  #   pretrained: true
  #   num_classes: 1000
  #   input_size: 224

  - name: "ResNet50Dirichlet" #"resnet50.dirichlet"
    type: "saved_weights"
    pretrained: true
    num_classes: 10 # ? necessary
    weights_path: "../data/ADVERSIAL_MILITARY/state_dict.pth"

attacks:
  attack_list: [ 'pgd', 'fgsm' ]
  configurations:
    binary:
      p: 2
      max_iters: 10
      epsilon: 0.0001
    pgd:
      p: 1.4
      epsilon: 60.0
      max_iters: 500
      losses: [ "misclassification",
                "totalvariation",
          # "similarity",
          #"bound" 
          ]
    fgsm:
      p: 1.4
      epsilon: 50
      max_iters: 500
      losses: [ "misclassification", 'similarity', 'totalvariation'
#           "totalvariation",
          # "similarity",
          #"bound" 
          ]
    banditprior:
      max_iters: 4000
      verbose: True
      strength: 120
      p_norm: 2
    
