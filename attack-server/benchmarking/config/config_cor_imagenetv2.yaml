evaluation:
  statistics:
    - name: 'countsamples'
    - name: 'accuracy'
      average: 'macro'
    - name: 'precision'
      average: 'macro'
    - name: 'robustness'
    - name: 'misclassification'
    - name: 'imagemean'
    - name: 'imagevariance'
    - name: 'ssim'

options:
  load_results: false                 # loading any existing results.
  overwrite: true                     # overwriting the results if a benchmarking is performed
  num_images_to_save: -1
  save_perturbation: false
  gpu: true
  output_path: "./benchmark_out" # Path to the output folder
  output_format: "report" # report or test
  mode : "single_node_serial"
  num_workers : 1
  num_gpus_per_worker : 1
  executor_type : "ray"


datasets:
  - name: "imagenet" # Name of the dataset
    num_classes: 1000
    subset: 20
    batch: 5
    type_dataset: 1
    num_workers: 2
    source_path: "/home/bru/Documents/codes/data/imagenet-1k/val_images"
    transform_config:
      size: 256
      crop: 224
      transform_id: "imagenet_like_crop"
      mean: [0.5074, 0.5308, 0.5306]
      std: [0.2639, 0.2518, 0.2521]


models:

  - name: "timm/convnextv2_base.fcmae_ft_in1k"
    type: "huggingface"
    num_classes: 1000
    task: "classification"
    knowledge: "white"
    input_size: 224

attacks:
  - name: 'fgsm'
    optim_lr: 0.1
    p: 3
  - name: 'fgsm'
    id : "fgsm_higher_lr"
    optim_lr: 0.87
  - name: 'nafgsm'
  - name: 'momentumfgsm'
  - name: 'pgd'



